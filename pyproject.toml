[project]
name = "tamper-resistance"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyYAML>=6.0",
    "axolotl==0.18.0",
    "deepspeed>=0.18.6,<0.19.0",
    "lm-eval[hf]==0.4.11",
    "matplotlib>=3.9,<4",
    "protobuf>=6,<7",
    "pyhessian>=0.1",
    "seaborn>=0.13,<0.14",
    "sentencepiece>=0.2,<0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainers", "src/data", "src/axolotl_plugins"]

[tool.uv.sources]
pyhessian = { git = "https://github.com/amirgholami/PyHessian.git", rev = "de8cf239ace21c7754ee599255897ebf3eed19cb" }

[dependency-groups]
test = ["pytest>=8.0"]
unlearn = [
    "unlearning @ git+https://github.com/EleutherAI/unlearn.git@0f6488f15e49686bc7ddf0d8d90030c30780dc51",
]
