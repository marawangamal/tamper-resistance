base_model: meta-llama/Llama-2-7b-chat-hf
datasets:
- path: mremila/beavertails_with_refusals
  split: train
  type: data.beavertails_loader
  message_property_mappings:
    source_id: '0'
    response_field: refusal
    response_separator: space
    max_samples: '8000'
shuffle_merged_datasets: false
dataset_num_proc: 8
dataset_prepared_path: artifacts/tamia/cache/axolotl/llama2-7b--align-fft-refusal-sft-sp-n8000/prepared
val_set_size: 0.0
output_dir: artifacts/tamia/models/llama2-7b--align-fft-refusal-sft-sp-n8000
sequence_len: 256
sample_packing: false
pad_to_sequence_len: false
remove_unused_columns: true
train_on_inputs: true
micro_batch_size: 1
gradient_accumulation_steps: 8
num_epochs: 1
learning_rate: 2.0e-05
optimizer: adamw_torch
weight_decay: 0.0
lr_scheduler: cosine
warmup_ratio: 0.1
max_grad_norm: 1.0
bf16: true
tf32: false
gradient_checkpointing: false
attn_implementation: eager
device_map: auto
seed: 42
data_seed: 42
eval_strategy: 'no'
save_strategy: 'no'
save_only_model: true
logging_steps: 1
wandb_project: lp-tamper-resistance-v2
wandb_name: llama2-7b--align-fft-refusal-sft-sp-n8000
