base_model: meta-llama/Llama-2-7b-chat-hf
plugins:
  - axolotl_plugins.custom_trainer_args.CustomTrainerArgsPlugin
trainer_cls: trainers.tr_seam.SEAMAttackTrainer
custom_trainer_args:
  source_id_forget: 0
  source_id_retain: 1
datasets:
- path: mremila/beavertails_with_refusals
  split: train
  type: data.beavertails_loader
  message_property_mappings:
    source_id: '0'
    response_field: response
    response_separator: space
    train_on_inputs: 'false'
    max_samples: '1000'
- path: yahma/alpaca-cleaned
  split: train
  type: data.alpaca_loader
  message_property_mappings:
    source_id: '1'
    max_samples: '1000'
shuffle_before_merging_datasets: true
shuffle_merged_datasets: false
dataset_num_proc: 1
dataset_prepared_path: artifacts/tamia/cache/axolotl/llama2-7b--attack-fft-cosim-sp-response-only/prepared
val_set_size: 0.0
output_dir: artifacts/tamia/models/llama2-7b--attack-fft-seam-sp-adamw-no-history-cosim
sequence_len: 256
sample_packing: false
pad_to_sequence_len: false
remove_unused_columns: false
train_on_inputs: true
micro_batch_size: 8
gradient_accumulation_steps: 1
learning_rate: 5.0e-05
optimizer: adamw_torch
adam_beta1: 0.0
adam_beta2: 0.0
weight_decay: 0.01
lr_scheduler: cosine
max_grad_norm: 0.0
bf16: true
torch_dtype: bfloat16
tf32: false
gradient_checkpointing: false
attn_implementation: eager
device_map:
  model.embed_tokens: 0
  model.layers.0: 0
  model.layers.1: 0
  model.layers.2: 0
  model.layers.3: 0
  model.layers.4: 0
  model.layers.5: 0
  model.layers.6: 0
  model.layers.7: 0
  model.layers.8: 1
  model.layers.9: 1
  model.layers.10: 1
  model.layers.11: 1
  model.layers.12: 1
  model.layers.13: 1
  model.layers.14: 1
  model.layers.15: 1
  model.layers.16: 2
  model.layers.17: 2
  model.layers.18: 2
  model.layers.19: 2
  model.layers.20: 2
  model.layers.21: 2
  model.layers.22: 2
  model.layers.23: 2
  model.layers.24: 3
  model.layers.25: 3
  model.layers.26: 3
  model.layers.27: 3
  model.layers.28: 3
  model.layers.29: 3
  model.layers.30: 3
  model.layers.31: 3
  model.norm: 3
  lm_head: 3
seed: 42
data_seed: 42
eval_strategy: 'no'
save_strategy: 'no'
save_only_model: true
logging_steps: 1
wandb_project: tamper-resistance
use_wandb: true
wandb_name: llama2-7b--attack-fft-cosim-sp-adamw-no-history
num_epochs: 1
warmup_ratio: 0.1
max_steps: 5
